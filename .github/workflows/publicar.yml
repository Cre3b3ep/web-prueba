# Construye la web con Eleventy y la publica en GitHub Pages.
#  - En cada Pull Request: sólo construye (si falla, el PR se marca en rojo).
#  - En cada push a main: construye y publica en https://cre3b3ep.github.io/web-prueba/
# Requisito (una sola vez): Settings -> Pages -> Source: "GitHub Actions".
name: Publicar web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Permisos mínimos: leer el código; escribir en Pages sólo en el job de despliegue
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
